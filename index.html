<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SimpleARM: Simple Agentic Robot Memory for Generalist Robot Policies</title>
  <meta name="description" content="SimpleARM: Simple Agentic Robot Memory for Generalist Robot Policies. Paper and code will be released soon.">
  <style>
    :root { --fg: #111827; --muted: #6b7280; --line: #e5e7eb; --bg: #ffffff; --accent: #111827; }
    @media (prefers-color-scheme: dark) { :root { --fg: #f3f4f6; --muted: #9ca3af; --line: #374151; --bg: #0b0f17; --accent: #f3f4f6; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: var(--bg); color: var(--fg); padding: 32px 16px;
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    main { max-width: 720px; text-align: center; }
    h1 { font-size: clamp(2.4rem, 7vw, 3.6rem); margin: 0 0 12px; letter-spacing: -0.02em; }
    h2 { font-size: clamp(1.1rem, 3vw, 1.4rem); font-weight: 500; margin: 0 0 32px; color: var(--muted); line-height: 1.4; }
    .status { display: inline-flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 32px; }
    .pill { border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; font-size: 0.95rem; }
    a.button { display: inline-block; border: 1px solid var(--accent); color: var(--fg); text-decoration: none;
               border-radius: 8px; padding: 10px 18px; font-weight: 500; }
    a.button:hover { background: var(--accent); color: var(--bg); }
  </style>
</head>
<body>
  <main>
    <h1>SimpleARM</h1>
    <h2>Simple Agentic Robot Memory for Generalist Robot Policies</h2>
    <div class="status">
      <span class="pill">Paper: coming soon</span>
      <span class="pill">Code: coming soon</span>
    </div>
    <div><a class="button" href="https://github.com/simplearm/SimpleARM">GitHub</a></div>
  </main>
</body>
</html>
